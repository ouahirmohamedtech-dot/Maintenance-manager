<style>
:root{--ink:#17332f;--muted:#687b77;--line:#dce6e2;--bg:#f3f7f5;--card:#fff;--green:#176b57;--dark:#123b36;--pale:#e8f3ef;--amber:#a6650a;--red:#b23b37;--blue:#286a9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--dark);color:#fff;padding:18px max(16px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:21px;margin:0}header p{margin:4px 0 0;color:#c6ddd5;font-size:12px}.wrap{max-width:1200px;margin:18px auto;padding:0 14px}.nav{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.nav button{white-space:nowrap;background:#fff;color:var(--ink);border:1px solid var(--line)}.nav button.active{background:var(--green);color:#fff;border-color:var(--green)}button,select,input,textarea{font:inherit}button{border:0;border-radius:10px;background:var(--green);color:white;padding:10px 13px;cursor:pointer}button.secondary{background:white;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff0ef;color:var(--red);border:1px solid #f2d1cf}button:disabled{opacity:.55;cursor:not-allowed}input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink);width:100%;min-width:0}textarea{min-height:75px;resize:vertical}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}.toolbar input{flex:1;min-width:180px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat,.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:12px}.list{display:grid;gap:9px}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.item h3{font-size:16px;margin:7px 0 5px}.meta{font-size:12px;color:var(--muted);line-height:1.7}.pill,.tag{font-size:11px;border-radius:99px;padding:5px 9px;background:#edf1ef;white-space:nowrap}.pill.green{background:#e5f4e9;color:#27683a}.pill.amber{background:#fff2dc;color:#86550b}.pill.red{background:#ffeded;color:#a22f2a}.pill.blue{background:#e6f1fb;color:#245d8b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.money{font-weight:750;color:var(--green)}.hidden{display:none!important}.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}.section-title h2{font-size:19px;margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:600}.modalhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}dialog{border:0;border-radius:16px;width:min(720px,calc(100% - 20px));padding:0;box-shadow:0 20px 70px #102d2833}dialog::backdrop{background:#0c211dcc}.chartbar{height:9px;background:#e8efec;border-radius:9px;overflow:hidden}.chartbar span{display:block;height:100%;background:#238568}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:start;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:650;background:#f8faf9}.notice{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}.tile{padding:14px;border-radius:13px;border:1px solid var(--line);background:white}.tile b{display:block;margin:6px 0}.small{font-size:11px;color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar button{flex:1}.section-title{align-items:flex-start}.stat strong{font-size:21px}}@media print{header,.nav,.toolbar,.actions,button{display:none!important}body{background:white}.wrap{max-width:none}}

<header><div><h1>🏨 Gestion Maintenance & Paiements</h1><p>Suivi des paiements · Chèques · Factures · Réparations</p></div><div class="actions"><button class="secondary" id="langBtn">العربية</button><button class="secondary" id="backupBtn">Exporter sauvegarde</button></div></header>
<main class="wrap"><nav class="nav" id="nav"></nav><section id="view"></section><p class="notice">Les données sont enregistrées sur cet appareil dans le navigateur. Exportez régulièrement une sauvegarde JSON. Pour synchroniser plusieurs appareils, un service cloud devra être configuré.</p></main>
<dialog id="dlg"><div class="modalhead"><b id="dlgTitle">Ajouter</b><button class="secondary" type="button" onclick="closeDlg()">✕</button></div><form id="form"><div class="formgrid" id="fields"></div><div class="modalfoot"><button class="secondary" type="button" onclick="closeDlg()">Annuler</button><button type="submit">Enregistrer</button></div></form></dialog>
<script>
const DB='maintenance-manager-db',VER=8,STORES=['interventions','finance','sites','payments','contacts','companies','repairs','documents','categories'];let db,lang='fr',page='dashboard',cache={};const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),uid=p=>p+'-'+Date.now()+'-'+Math.floor(Math.random()*1000),money=n=>(Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:2})+' DH',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={fr:{dashboard:'Tableau de bord',payments:'Paiements',checks:'Chèques',cash:'Espèces',contacts:'Contacts',companies:'Sociétés émettrices',invoices:'Factures',repairs:'Réparations',deadlines:'Échéances',categories:'Catégories',budgets:'Budgets',reports:'Rapports',settings:'Paramètres'},ar:{dashboard:'لوحة القيادة',payments:'المدفوعات',checks:'الشيكات',cash:'النقد',contacts:'الحرفيون والموردون',companies:'الشركات المصدرة',invoices:'الفواتير',repairs:'الإصلاحات',deadlines:'الاستحقاقات',categories:'التصنيفات',budgets:'الميزانيات',reports:'التقارير',settings:'الإعدادات'}};const pages=Object.keys(labels.fr);
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function txdone(t){return new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function all(store){return req(db.transaction(store).objectStore(store).getAll())}async function put(store,obj){let t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);return txdone(t)}async function del(store,id){let t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);return txdone(t)}
function makeLocalStorageDB(){
 const key=s=>'gmp_fallback_'+s;
 return {transaction(store,mode='readonly'){
  const tx={error:null,objectStore(){return {
   getAll(){const q={result:null,error:null};setTimeout(()=>{try{q.result=JSON.parse(localStorage.getItem(key(store))||'[]');q.onsuccess&&q.onsuccess()}catch(e){q.error=e;q.onerror&&q.onerror()}},0);return q},
   put(obj){setTimeout(()=>{try{const a=JSON.parse(localStorage.getItem(key(store))||'[]');const kp=store==='sites'?'name':'id';const i=a.findIndex(x=>x[kp]===obj[kp]);if(i<0)a.push(obj);else a[i]=obj;localStorage.setItem(key(store),JSON.stringify(a));tx.oncomplete&&tx.oncomplete()}catch(e){tx.error=e;tx.onerror&&tx.onerror()}},0);return {}},
   delete(id){setTimeout(()=>{try{const kp=store==='sites'?'name':'id';const a=JSON.parse(localStorage.getItem(key(store))||'[]').filter(x=>x[kp]!==id);localStorage.setItem(key(store),JSON.stringify(a));tx.oncomplete&&tx.oncomplete()}catch(e){tx.error=e;tx.onerror&&tx.onerror()}},0);return {}}
  }}};return tx;
 }};
}
async function initDB(){
 try{
  if(!window.indexedDB)throw new Error('IndexedDB indisponible dans ce navigateur');
  db=await new Promise((res,rej)=>{let r;try{r=indexedDB.open(DB,VER)}catch(e){rej(e);return}r.onupgradeneeded=()=>{let d=r.result;for(let s of STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='sites'?'name':'id'});};r.onsuccess=()=>{let d=r.result;d.onversionchange=()=>d.close();res(d)};r.onerror=()=>rej(r.error||new Error('Erreur IndexedDB'));r.onblocked=()=>rej(new Error('La base est utilisée par un autre onglet. Fermez les autres onglets de cette application puis rechargez.'))});
  for(let s of STORES)cache[s]=await all(s);
  return 'indexeddb';
 }catch(err){
  console.warn('IndexedDB indisponible, passage au stockage local de secours:',err);
  db=makeLocalStorageDB();
  for(let s of STORES)cache[s]=await all(s);
  return 'localstorage';
 }
}
const get=(s)=>cache[s]||[];async function reload(){for(let s of STORES)cache[s]=await all(s)}function nav(){ $('nav').innerHTML=pages.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${labels[lang][p]}</button>`).join('')}
function go(p){page=p;nav();render()}function siteOpts(){let a=get('sites').map(x=>x.name);for(let x of ['Hôtel 1','Hôtel 2','Restaurant'])if(!a.includes(x))a.push(x);return a.map(x=>`<option>${esc(x)}</option>`).join('')}
function contactOpts(){return get('contacts').map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.type)}</option>`).join('')}function companyOpts(){return get('companies').map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}
function stat(label,value){return `<div class="stat"><small>${label}</small><strong>${value}</strong></div>`}function empty(t){return `<div class="empty">${t}</div>`}
function dashboard(){let ps=get('payments'),paid=ps.reduce((a,x)=>a+ +x.amount,0),ch=ps.filter(x=>x.method==='Chèque').reduce((a,x)=>a+ +x.amount,0),cash=paid-ch,inv=get('documents').filter(x=>x.kind==='Facture'),rep=get('repairs');return `<div class="section-title"><h2>Vue générale</h2><span class="small">${today()}</span></div><div class="stats">${stat('Total des paiements',money(paid))}${stat('Par chèque',money(ch))}${stat('En espèces',money(cash))}${stat('Réparations enregistrées',rep.length)}</div><div class="grid"><div class="tile"><b>🧾 Factures reçues</b><strong>${inv.filter(x=>x.received==='Oui').length}</strong><div class="small">Non reçues : ${inv.filter(x=>x.received!=='Oui').length}</div></div><div class="tile"><b>🛠 Réparations en cours</b><strong>${rep.filter(x=>x.status!=='Terminée').length}</strong><div class="small">Terminées : ${rep.filter(x=>x.status==='Terminée').length}</div></div><div class="tile"><b>👥 Contacts</b><strong>${get('contacts').length}</strong><div class="small">Artisans et fournisseurs</div></div><div class="tile"><b>🏢 Sociétés émettrices</b><strong>${get('companies').length}</strong><div class="small">Comptes émetteurs de chèques</div></div></div><div class="section-title"><h2>Derniers paiements</h2><button onclick="go('payments')">Voir tout</button></div>${paymentTable(ps.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5))}`}
function paymentTable(arr){if(!arr.length)return empty('Aucun paiement enregistré.');return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Bénéficiaire</th><th>Mode</th><th>Société émettrice</th><th>Montant</th><th>Facture</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(nameContact(x.contactId)||x.beneficiary||'—')}</td><td>${esc(x.method)}</td><td>${esc(nameCompany(x.companyId)||'—')}</td><td class="money">${money(x.amount)}</td><td>${x.invoiceReceived==='Oui'?'Oui':'Non'}</td><td><button class="secondary" onclick="editRecord('payments','${x.id}')">Modifier</button></td></tr>`).join('')}</tbody></table></div>`}
function nameContact(id){return get('contacts').find(x=>x.id===id)?.name}function nameCompany(id){return get('companies').find(x=>x.id===id)?.name}
function listPage(store,title,add,rows,filters=''){let a=get(store);return `<div class="section-title"><h2>${title}</h2><button onclick="addRecord('${store}')">＋ Ajouter</button></div>${filters}<div class="list">${a.length?rows(a):empty('Aucun enregistrement pour le moment.')}</div>`}
function card(title,sub,meta,store,id){return `<article class="item"><div class="itemtop"><h3>${title}</h3>${meta||''}</div><div class="meta">${sub||''}</div><div class="actions"><button class="secondary" onclick="editRecord('${store}','${id}')">Modifier</button><button class="danger" onclick="removeRecord('${store}','${id}')">Supprimer</button></div></article>`}
function render(){let v=$('view');if(page==='dashboard'){v.innerHTML=dashboard();return}if(page==='payments'||page==='checks'||page==='cash'){let a=get('payments').filter(x=>page==='payments'||(page==='checks'?x.method==='Chèque':x.method==='Espèces'));v.innerHTML=`<div class="section-title"><h2>${labels[lang][page]}</h2><button onclick="addRecord('payments')">＋ Nouveau paiement</button></div>${paymentTable(a)}`;return}
if(page==='contacts'){v.innerHTML=listPage('contacts',labels[lang].contacts,'',a=>a.map(x=>card(esc(x.name),`${esc(x.type)} · ${esc(x.specialty||'')}<br>☎ ${esc(x.phone||'—')} ${x.phone2?' · '+esc(x.phone2):''}<br>${esc(x.address||'')}`,`<span class="pill blue">${esc(x.type)}</span>`,'contacts',x.id)).join(''));return}
if(page==='companies'){v.innerHTML=listPage('companies',labels[lang].companies,'',a=>a.map(x=>card(esc(x.name),`ICE: ${esc(x.ice||'—')} · ${esc(x.phone||'')}<br>${esc(x.address||'')}`, '', 'companies',x.id)).join(''));return}
if(page==='invoices'){let a=get('documents').filter(x=>x.kind==='Facture');v.innerHTML=listPage('documents','Factures','',a=>a.map(x=>card(esc(x.number||'Facture sans numéro'),`${esc(x.supplier||'')} · ${money(x.amount)} · ${esc(x.date||'')}<br>Reçue : ${esc(x.received||'Non')} · Paiement : ${esc(x.paymentId||'—')}`,`<span class="pill ${x.received==='Oui'?'green':'red'}">${x.received==='Oui'?'Reçue':'Non reçue'}</span>`,'documents',x.id)).join(''));return}
if(page==='repairs'){v.innerHTML=listPage('repairs',labels[lang].repairs,'',a=>a.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||'')).map(x=>card(esc(x.title),`${esc(x.site)} · ${esc(x.place)} · ${esc(x.type)}<br>${esc(x.date)} · ${esc(nameContact(x.contactId)||x.provider||'Non assigné')}<br>Coût estimé : ${money(x.cost)} · Coût final : ${money(x.finalCost)}<br>${esc(x.description||'')}`,`<span class="pill ${x.status==='Terminée'?'green':x.status==='En cours'?'blue':'amber'}">${esc(x.status)}</span>`,'repairs',x.id)).join(''));return}
if(page==='deadlines'){let a=get('payments').filter(x=>x.method==='Chèque'&&x.dueDate);v.innerHTML=listPage('payments','Échéances des chèques','',a=>a.slice().sort((x,y)=>x.dueDate.localeCompare(y.dueDate)).map(x=>card('Chèque '+esc(x.checkNo||'—'),`${esc(nameContact(x.contactId)||x.beneficiary||'')} · ${esc(nameCompany(x.companyId)||'')}<br>Échéance : ${esc(x.dueDate)} · ${money(x.amount)}`,`<span class="pill amber">${esc(x.status||'En attente')}</span>`,'payments',x.id)).join(''));return}
if(page==='categories'){v.innerHTML=listPage('categories','Catégories de dépenses','',a=>a.map(x=>card(esc(x.name),esc(x.note||''),'','categories',x.id)).join(''));return}
if(page==='budgets'){v.innerHTML=listPage('categories','Budgets par établissement','',a=>a.filter(x=>x.budget).map(x=>card(esc(x.name),`Budget : ${money(x.budget)} · ${esc(x.site||'Tous les établissements')}`,'','categories',x.id)).join(''));return}
if(page==='reports'){let ps=get('payments'),sum=ps.reduce((a,x)=>a+ +x.amount,0),byMethod=['Chèque','Espèces'].map(m=>({m,n:ps.filter(x=>x.method===m).reduce((a,x)=>a+ +x.amount,0)}));v.innerHTML=`<div class="section-title"><h2>Rapports</h2><button onclick="window.print()">Imprimer / PDF</button></div><div class="stats">${stat('Total payé',money(sum))}${stat('Nombre de paiements',ps.length)}${stat('Factures',get('documents').filter(x=>x.kind==='Facture').length)}${stat('Réparations',get('repairs').length)}</div>${byMethod.map(x=>`<div class="panel"><b>${x.m} · ${money(x.n)}</b><div class="chartbar"><span style="width:${sum?x.n/sum*100:0}%"></span></div></div>`).join('')}<div class="actions"><button onclick="exportCSV()">Exporter paiements CSV</button><button class="secondary" onclick="backup()">Sauvegarde JSON</button></div>`;return}
if(page==='settings'){v.innerHTML=`<div class="section-title"><h2>Paramètres</h2></div><div class="panel"><h3>Établissements</h3><form class="toolbar" onsubmit="addSite(event)"><input id="siteName" placeholder="Nom de l'établissement" required><button>Ajouter</button></form><div class="list">${get('sites').map(x=>`<div class="item">${esc(x.name)} <button class="danger" onclick="deleteSite('${esc(x.name)}')">Supprimer</button></div>`).join('')}</div></div><div class="panel" style="margin-top:10px"><h3>Données</h3><p class="meta">Les informations sont stockées localement dans le navigateur. Gardez une sauvegarde JSON régulière.</p><div class="actions"><button onclick="backup()">Exporter sauvegarde</button><label class="secondary" style="padding:10px;border-radius:10px;cursor:pointer">Importer sauvegarde<input type="file" accept="application/json" onchange="restore(event)" hidden></label></div></div>`;return}}
function fieldsFor(store,obj={}){let f=[];const add=(id,label,type='text',opts=null,required=false,full=false)=>f.push({id,label,type,opts,required,full});if(store==='contacts'){add('name','Nom / Société','text',null,true);add('type','Type','select',['Artisan','Fournisseur','Entreprise','Autre'],true);add('specialty','Spécialité / Activité');add('phone','Téléphone 1');add('phone2','Téléphone 2');add('email','Email');add('address','Adresse','text',null,false,true);add('notes','Notes','textarea',null,false,true)}
if(store==='companies'){add('name','Nom de la société émettrice','text',null,true);add('ice','ICE');add('phone','Téléphone');add('address','Adresse','text',null,false,true)}
if(store==='payments'){add('contactId','Bénéficiaire','select',get('contacts').map(x=>({value:x.id,label:x.name})));add('beneficiary','Nom bénéficiaire (si non enregistré)');add('companyId','Société émettrice du chèque','select',get('companies').map(x=>({value:x.id,label:x.name})));add('method','Mode de paiement','select',['Chèque','Espèces','À préciser'],true);add('amount','Montant (DH)','number',null,true);add('date','Date de paiement','date',null,true);add('checkNo','Numéro du chèque');add('bank','Banque');add('dueDate','Date d’échéance','date');add('status','Statut du chèque','select',['En attente','Déposé','Encaissé','Rejeté']);add('invoiceReceived','Facture reçue ?','select',['Oui','Non'],true);add('invoiceNo','N° facture');add('site','Établissement','select',siteArray());add('category','Catégorie');add('notes','Observations','textarea',null,false,true)}
if(store==='documents'){add('kind','Type','select',['Facture','Devis','Bon de commande','Autre'],true);add('number','Numéro du document');add('supplier','Fournisseur');add('amount','Montant (DH)','number');add('date','Date','date');add('received','Reçue ?','select',['Oui','Non']);add('paymentId','Référence paiement');add('notes','Notes','textarea',null,false,true)}
if(store==='repairs'){add('site','Établissement','select',siteArray(),true);add('place','Emplacement','text',null,true);add('title','Titre de la réparation','text',null,true);add('type','Type','select',['Électricité','Climatisation','Plomberie','Ventilation','Réseau informatique','Mécanique','Ascenseur','Sécurité incendie','Autre'],true);add('date','Date de demande','date',null,true);add('status','État','select',['En attente','En cours','Terminée','À vérifier']);add('contactId','Artisan / Fournisseur','select',get('contacts').map(x=>({value:x.id,label:x.name})));add('provider','Prestataire (si non enregistré)');add('description','Description du problème','textarea',null,false,true);add('cost','Coût estimé (DH)','number');add('labor','Main-d’œuvre (DH)','number');add('materials','Matériel / pièces (DH)','number');add('finalCost','Coût final (DH)','number');add('paymentId','Paiement associé','select',get('payments').map(x=>({value:x.id,label:`${x.date} · ${money(x.amount)} · ${nameContact(x.contactId)||x.beneficiary||''}`})));add('invoiceNo','N° facture');add('notes','Notes','textarea',null,false,true)}
if(store==='categories'){add('name','Nom de la catégorie','text',null,true);add('site','Établissement','select',siteArray());add('budget','Budget (DH)','number');add('note','Description','textarea',null,false,true)}return f}
function siteArray(){return get('sites').map(x=>x.name).concat(['Hôtel 1','Hôtel 2','Restaurant']).filter((x,i,a)=>a.indexOf(x)===i)}
function addRecord(store){openForm(store,{})}function editRecord(store,id){let x=get(store).find(x=>x.id===id);if(x)openForm(store,x)}
function openForm(store,obj){let fields=fieldsFor(store,obj);$('dlgTitle').textContent=(obj.id?'Modifier':'Ajouter')+' · '+store;$('fields').innerHTML=fields.map(f=>{let val=obj[f.id]??(f.id==='date'?today():f.id==='status'?(store==='repairs'?'En attente':'En attente'):f.id==='invoiceReceived'?'Non':'');let control;if(f.type==='select'){let opts=(f.opts||[]).map(o=>typeof o==='string'?{value:o,label:o}:o);control=`<select id="f_${f.id}" ${f.required?'required':''}><option value="">— Choisir —</option>${opts.map(o=>`<option value="${esc(o.value)}" ${String(val)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`}else if(f.type==='textarea')control=`<textarea id="f_${f.id}">${esc(val)}</textarea>`;else control=`<input id="f_${f.id}" type="${f.type}" value="${esc(val)}" ${f.required?'required':''} ${f.type==='number'?'min="0" step="0.01"':''}>`;return `<div class="field ${f.full?'full':''}"><label>${f.label}${f.required?' *':''}</label>${control}</div>`}).join('');$('form').dataset.store=store;$('form').dataset.id=obj.id||'';$('dlg').showModal()}
$('form').onsubmit=async e=>{e.preventDefault();let store=e.target.dataset.store,id=e.target.dataset.id||uid(store.slice(0,3)),old=get(store).find(x=>x.id===id)||{},obj={...old,id};for(let f of fieldsFor(store,old)){let el=$('f_'+f.id);if(el)obj[f.id]=el.value}if(store==='payments'&&obj.method!=='Chèque'){obj.checkNo='';obj.dueDate='';obj.companyId=''}await put(store,obj);await reload();closeDlg();render()};function closeDlg(){$('dlg').close()}
async function removeRecord(store,id){if(!confirm('Supprimer cet enregistrement ?'))return;await del(store,id);await reload();render()}
async function addSite(e){e.preventDefault();let name=$('siteName').value.trim();if(!name)return;await put('sites',{name});await reload();render()}async function deleteSite(name){if(!confirm('Supprimer cet établissement ?'))return;await del('sites',name);await reload();render()}
function backup(){let data={version:1,exportedAt:new Date().toISOString()};for(let s of STORES)data[s]=get(s);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='gestion-maintenance-paiements-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(e){let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());for(let s of STORES)for(let x of (d[s]||[]))await put(s,x);await reload();render();alert('Sauvegarde importée.')}catch(err){alert('Fichier invalide : '+err.message)}e.target.value=''}
function exportCSV(){let rows=[['Date','Beneficiaire','Mode','Societe emettrice','Numero cheque','Montant DH','Facture recue','Numero facture']];for(let x of get('payments'))rows.push([x.date,nameContact(x.contactId)||x.beneficiary,x.method,nameCompany(x.companyId),x.checkNo,x.amount,x.invoiceReceived,x.invoiceNo]);let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='paiements-'+today()+'.csv';a.click()}
function setLang(){document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;$('langBtn').textContent=lang==='fr'?'العربية':'Français';nav();render()}$('langBtn').onclick=()=>{lang=lang==='fr'?'ar':'fr';setLang()};$('backupBtn').onclick=backup;window.go=go;window.addRecord=addRecord;window.editRecord=editRecord;window.removeRecord=removeRecord;window.closeDlg=closeDlg;window.backup=backup;window.restore=restore;window.addSite=addSite;window.deleteSite=deleteSite;window.exportCSV=exportCSV;
async function migrateLegacy(){let oldItems=await all('interventions'),oldFinance=await all('finance');for(let x of oldItems){if(!get('repairs').some(r=>r.id===x.id)){await put('repairs',{id:x.id,title:x.problem||'Intervention existante',site:x.site||'Hôtel 1',place:x.place||'',type:x.area||'Autre',date:x.date||today(),status:x.status==='Terminé'?'Terminée':(x.status||'En attente'),description:x.notes||'',provider:x.responsible||'',cost:0,finalCost:0,legacy:true});}}for(let c of oldFinance){let cid='legacy-'+c.id;if(!get('contacts').some(x=>x.id===cid)){await put('contacts',{id:cid,name:c.name||'Contact existant',type:'Artisan',specialty:c.specialty||c.work||'',phone:c.phone||'',address:'',notes:c.notes||'Importé de l’ancienne version'});}for(let p of (c.payments||[])){let pid='legacy-'+p.id;if(!get('payments').some(x=>x.id===pid)){await put('payments',{id:pid,contactId:cid,beneficiary:c.name||'',method:'À préciser',amount:Number(p.amount)||0,date:p.date||today(),notes:p.note||'Paiement importé de l’ancienne version'});}}}await reload();}
initDB().then(async(mode)=>{await migrateLegacy();nav();render();if(mode==='localstorage'){$('view').insertAdjacentHTML('afterbegin',`<div class="panel" style="border-color:#e7c98d;background:#fff9e9;margin-bottom:12px"><b>Mode de stockage de secours activé</b><p class="meta">Le navigateur a refusé IndexedDB. L’application fonctionne avec le stockage local de secours de cet appareil. Exportez régulièrement une sauvegarde JSON. Vos anciennes données IndexedDB ne sont pas effacées.</p></div>`)}}).catch(e=>{console.error(e);$('view').innerHTML=empty('Erreur de stockage : '+esc(e?.message||e))});
</script></body></html>
